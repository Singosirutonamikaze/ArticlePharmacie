<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTION D'ARTICLE PHARCEMEUTIQUE</title>
    <link rel="stylesheet" href="../css/index.css">

    <!-- font awesoms cdn link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css"
        integrity="sha512-9xKTRVabjVeZmc+GUW8GgSmcREDunMM+Dt/GrzchfN8tkwHizc5RP4Ok/MXFFy5rIjJjzhndFScTceq5e6GvVQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- font family link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Engagement&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f1f1f1;
            overflow: hidden;
        }

        .loader {
            width: 120px;
            height: 120px;
            display: flex;
            flex-wrap: wrap;
            perspective: 1000px;
        }

        .cube {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #a2c2e6, #e0eafc, #b4b8c1);
            margin: 5px;
            transform-style: preserve-3d;
            animation: rotateCube 1.5s infinite ease-in-out;
            position: relative;
        }

        .cube::before,
        .cube::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            transform-style: preserve-3d;
            transform: rotateX(90deg);
        }

        @keyframes rotateCube {
            0% {
                transform: rotateX(0deg) rotateY(0deg);
            }

            50% {
                transform: rotateX(180deg) rotateY(180deg);
            }

            100% {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="loader">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <script>
        setTimeout(() => {
            window.location.href = "./SiteWeb/html/index.html";
        }, 3000);
    </script>
</body>

</html>
